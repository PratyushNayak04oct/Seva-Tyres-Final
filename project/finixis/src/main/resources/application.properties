# ================================================================
# Seva Tyres — database connection settings
# ================================================================
# Set db.type to 'postgresql' (production) or 'h2' (local testing).
#
# If db.type=postgresql but the connection fails (wrong password,
# server not running, etc.), the app automatically falls back to
# the H2 embedded database so it always starts.
# ================================================================

db.type=postgresql

# --- PostgreSQL (primary — server running on this PC) ---
# !! IMPORTANT: Replace 'your_password_here' with your actual PostgreSQL password !!
pg.url=jdbc:postgresql://localhost:5432/sevatyres
pg.user=postgres
pg.password=12345678

# --- H2 (fallback embedded mode; used automatically if PostgreSQL fails) ---
h2.url=jdbc:h2:~/sevatyres-data/sevatyres;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
h2.user=sa
h2.password=

# --- HikariCP pool settings ---
pool.maximumPoolSize=10
pool.minimumIdle=2
pool.connectionTimeoutMs=5000
pool.idleTimeoutMs=600000
pool.maxLifetimeMs=1800000

# ================================================================
# Email reminder settings (Task 9)
# ================================================================
# Set mail.enabled=true to send credit reminder emails every 5 days.
# Use an App Password if you have 2FA enabled on your Gmail account.
# ================================================================
mail.enabled=false
mail.host=smtp.gmail.com
mail.port=587
mail.username=your_email@gmail.com
mail.password=your_app_password_here
mail.from=Seva Tyres <your_email@gmail.com>
mail.reminder.intervalDays=5
